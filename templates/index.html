<!DOCTYPE html>
<html>
<head>
    <title>PhishGuard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="container">
        <h1>🛡️ PhishGuard</h1>
        <p>Phishing URL Detection System</p>

        <form method="POST">
            <input type="text" name="url"
                   placeholder="Enter website URL"
                   required>
            <button type="submit">Analyse URL</button>
        </form>

        {% if result %}
            {% if result.error %}
                <h3>{{ result.error }}</h3>
            {% else %}
                <h2>{{ result.status }}</h2>
                <h3>Risk Score: {{ result.score }}/100</h3>

                <ul>
                {% for item in result.details %}
                    <li>{{ item }}</li>
                {% endfor %}
                </ul>
            {% endif %}
        {% endif %}
    </div>

</body>
</html>
